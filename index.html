<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국 위인들의 명언</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease-out;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-filter {
            background-color: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-filter:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-filter.active {
            background-color: #667eea;
            color: white;
        }

        .btn-refresh {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
        }

        .btn-refresh:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        .quotes-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            animation: fadeIn 0.6s ease-out;
        }

        .quote-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            border-left: 5px solid #667eea;
            animation: scaleIn 0.4s ease-out;
        }

        .quote-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .quote-text {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.6;
            font-style: italic;
        }

        .quote-text::before {
            content: '"';
            font-size: 2rem;
            color: #667eea;
            opacity: 0.3;
            margin-right: 5px;
        }

        .quote-author {
            color: #764ba2;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .quote-category {
            display: inline-block;
            background-color: #f0f0f0;
            color: #667eea;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 40px 20px;
        }

        .empty-state h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .header p {
                font-size: 1rem;
            }

            .quotes-container {
                grid-template-columns: 1fr;
            }

            .controls {
                gap: 8px;
            }

            .btn {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .header p {
                font-size: 0.9rem;
            }

            .quote-card {
                padding: 20px;
            }

            .quote-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>한국 위인들의 명언</h1>
            <p>역사 속 위대한 분들의 지혜와 통찰력</p>
        </div>

        <div class="controls">
            <button class="btn btn-filter active" onclick="filterQuotes('all')">전체</button>
            <button class="btn btn-filter" onclick="filterQuotes('독립운동')">독립운동가</button>
            <button class="btn btn-filter" onclick="filterQuotes('학자')">학자</button>
            <button class="btn btn-filter" onclick="filterQuotes('군인')">군인</button>
            <button class="btn btn-refresh" onclick="randomQuote()">🎲 랜덤 명언</button>
        </div>

        <div id="quotes-list" class="quotes-container"></div>
    </div>

    <script>
        const quotes = [
            {
                text: "나라를 빼앗겼다고 해서 민족을 빼앗긴 것이 아니다. 민족 정신이 살아있는 한 언제든지 나라는 다시 일어날 수 있다.",
                author: "윤봉길 의사",
                category: "독립운동"
            },
            {
                text: "죽는 것이 아니라 살아있는 동안 나라를 위해 무엇을 했는가가 중요하다.",
                author: "유관순 열사",
                category: "독립운동"
            },
            {
                text: "백만 명의 군대보다 내 마음에 있는 신념 하나가 더 강하다.",
                author: "이순신 장군",
                category: "군인"
            },
            {
                text: "나이 많은 것도 아니고, 지금까지 바라던 것도 아니고, 죽음도 두렵지 않다. 다만 백성들이 편하고 나라가 번영하는 것이 내 바람이다.",
                author: "세종대왕",
                category: "학자"
            },
            {
                text: "자신의 약점을 아는 사람이 가장 강한 사람이다.",
                author: "김수환 추기경",
                category: "학자"
            },
            {
                text: "우리가 죽은 뒤에 백 년 뒤의 조선이 어떻게 될 것 같으냐는 질문에 그것은 모르겠지만, 지금 우리가 할 수 있는 것을 하자는 것이 나의 주장이다.",
                author: "김구",
                category: "독립운동"
            },
            {
                text: "겨레가 원하는 것이 나의 목표이고, 그것이 바로 역사의 방향이다.",
                author: "안중근 의사",
                category: "독립운동"
            },
            {
                text: "책을 읽으면 마음이 부자가 된다.",
                author: "김정호",
                category: "학자"
            },
            {
                text: "살아있는 동안 충의를 다하는 것이 사람의 도리이다.",
                author: "이순신 장군",
                category: "군인"
            },
            {
                text: "민족의 독립을 위해서는 개인의 생명도 중요하지 않다.",
                author: "이준",
                category: "독립운동"
            },
            {
                text: "어떤 분야에서든 최고가 되려면 그 일을 사랑하고, 그 일을 위해 희생할 준비가 되어 있어야 한다.",
                author: "박지원",
                category: "학자"
            },
            {
                text: "나라를 사랑하는 것은 추상적인 것이 아니라 매일의 실천이다.",
                author: "황현",
                category: "학자"
            }
        ];

        let currentFilter = 'all';

        function displayQuotes(quotesList) {
            const container = document.getElementById('quotes-list');
            if (quotesList.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1;" class="empty-state">
                        <h2>해당하는 명언이 없습니다.</h2>
                        <p>다른 카테고리를 시도해보세요.</p>
                    </div>
                `;
                return;
            }
            container.innerHTML = quotesList.map(quote => `
                <div class="quote-card">
                    <div class="quote-text">${quote.text}</div>
                    <div class="quote-author">- ${quote.author}</div>
                    <span class="quote-category">${quote.category}</span>
                </div>
            `).join('');
        }

        function filterQuotes(category) {
            currentFilter = category;

            // 활성 버튼 업데이트
            document.querySelectorAll('.btn-filter').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // 명언 필터링
            const filtered = category === 'all'
                ? quotes
                : quotes.filter(q => q.category === category);

            displayQuotes(filtered);
        }

        function randomQuote() {
            const filtered = currentFilter === 'all'
                ? quotes
                : quotes.filter(q => q.category === currentFilter);

            if (filtered.length === 0) {
                displayQuotes([]);
                return;
            }

            const randomIndex = Math.floor(Math.random() * filtered.length);
            displayQuotes([filtered[randomIndex]]);
        }

        // 초기 로드
        displayQuotes(quotes);
    </script>
</body>
</html>
